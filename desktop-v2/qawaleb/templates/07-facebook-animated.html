
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>منشور متحرك · FB Animated</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #f0f2f5; --card: #ffffff; --text: #050505; --muted: #65676b; --blue: #1877f2; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; font-family: "Tajawal", sans-serif; }
  .viewport { position: fixed; inset: 0; display: grid; place-items: center; perspective: 1200px; }
  .stage { width: 1920px; height: 1080px; position: relative; background: radial-gradient(circle at 20% 80%, #e0e4ea 0%, #ccd0d5 100%); overflow: hidden; }
  
  /* Giant Background SVG */
  .bg-logo { position: absolute; right: -150px; bottom: -150px; opacity: 0.04; width: 1200px; height: 1200px; animation: bgPulse 20s ease-in-out infinite alternate;}
  @keyframes bgPulse { 0% { transform: scale(1) rotate(0); } 100% { transform: scale(1.1) rotate(5deg); } }

  .entrance-wrapper { position: absolute; top: 50%; left: 50%; opacity: 0; transform: translate(-50%, -30%); }
  .float-wrapper { transform-style: preserve-3d; }

  .fb-card { width: 900px; background: var(--card); border-radius: 16px; padding: 30px; box-shadow: 0 30px 80px rgba(0,0,0,0.2); }
  
  .anim-item { opacity: 0; transform: translateY(20px); }

  .user-header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
  .avatar { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; }
  .name { font-size: 26px; font-weight: 700; color: var(--text); }
  .time { font-size: 18px; color: var(--muted); }

  .post-text { font-size: 34px; line-height: 1.5; color: var(--text); margin-bottom: 25px; }
  
  .post-image { width: calc(100% + 60px); margin: 0 -30px 20px; height: 500px; overflow: hidden; border-top: 1px solid #ced0d4; border-bottom: 1px solid #ced0d4; }
  .post-image img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.1); transition: transform 15s linear;}

  .reactions { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 22px; border-bottom: 1px solid #ced0d4; padding-bottom: 15px; }
  .actions { display: flex; padding-top: 15px; justify-content: space-around; color: var(--muted); font-size: 24px; font-weight: 600; }

  /* Animations */
  .playing .entrance-wrapper { animation: cardEnterFB 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
  .playing .float-wrapper { animation: floatFB 15s ease-in-out infinite 1s; }
  
  .playing .item-1 { animation: itemFade 0.8s 0.5s forwards; }
  .playing .item-2 { animation: itemFade 0.8s 0.7s forwards; }
  .playing .item-3 { animation: itemFade 0.8s 0.9s forwards; }
  .playing .item-4 { animation: itemFade 0.8s 1.1s forwards; }
  
  .playing .post-image img { transform: scale(1); } /* Slow zoom out during play */

  @keyframes cardEnterFB { to { opacity: 1; transform: translate(-50%, -50%); } }
  @keyframes floatFB { 
    0%, 100% { transform: translateY(0) rotateZ(0); } 
    50% { transform: translateY(-10px) rotateZ(0.5deg); }
  }
  @keyframes itemFade { to { opacity: 1; transform: translateY(0); } }

  .controls { position: fixed; left: 24px; bottom: 24px; z-index: 50; background: #fff; padding: 15px; border-radius: 12px; width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); font-family: inherit;}
  .controls input, .controls textarea { width: 100%; background: #f0f2f5; border: 1px solid #ccd0d5; padding: 10px; margin-bottom: 10px; border-radius: 8px; font-family: inherit;}
  .btn { background: var(--blue); color: #fff; border: none; padding: 12px; width: 100%; cursor: pointer; border-radius: 8px; font-weight: bold; font-size:16px;}
</style>
</head>
<body>
<div class="viewport">
  <div class="stage" id="stage">
    <!-- FB SVG Icon for background -->
    <svg class="bg-logo" viewBox="0 0 512 512"><path fill="#000" d="M512,257.555c0,-141.385 -114.615,-256 -256,-256c-141.385,0 -256,114.615 -256,256c0,127.777 93.616,233.685 216,252.89l0,-178.89l-65,0l0,-74l65,0l0,-56.4c0,-64.16 38.219,-99.6 96.695,-99.6c28.009,0 57.305,5 57.305,5l0,63l-32.281,0c-31.801,0 -41.719,19.733 -41.719,39.976l0,48.024l71,0l-11.35,74l-59.65,0l0,178.89c122.385,-19.205 216,-125.113 216,-252.89z"/></svg>

    <div class="entrance-wrapper">
      <div class="float-wrapper">
        <div class="fb-card">
          <div class="user-header anim-item item-1">
            <img class="avatar" src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&w=200" />
            <div>
              <div class="name" id="name"></div>
              <div class="time">أمس في ٨:٣٠ م • 🌐</div>
            </div>
          </div>
          <div class="post-text anim-item item-2" id="text"></div>
          <div class="post-image anim-item item-3"><img id="photo" src="" /></div>
          <div class="reactions anim-item item-4"><span>❤️ 👍 ٢٨ ألف</span> <span style="margin-right:auto">١,٤٠٠ تعليق • ٥٦٠ مشاركة</span></div>
          <div class="actions anim-item item-4"><div>اعجبني</div> <div>تعليق</div> <div>مشاركة</div></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="controls">
  <input id="i-name" value="الصفحة الرسمية للمدينة" />
  <textarea id="i-text" rows="2">استمرار أعمال التطوير في الواجهة البحرية، المشروع يهدف لتعزيز السياحة وتوفير مساحات خضراء جديدة للأهالي.</textarea>
  <input id="i-img" value="https://images.unsplash.com/photo-1548625361-195fe01823ff?w=1000&q=80" />
  <button class="btn" onclick="play()">▶ عرض بأنيميشن كامل</button>
</div>
<script>
  function fit() { document.getElementById('stage').style.transform = `scale(${Math.min(innerWidth/1920, innerHeight/1080)})`; }
  window.addEventListener('resize', fit); fit();
  function play() {
    document.getElementById('name').innerText = document.getElementById('i-name').value;
    document.getElementById('text').innerText = document.getElementById('i-text').value;
    document.getElementById('photo').src = document.getElementById('i-img').value;
    const stage = document.getElementById('stage');
    stage.classList.remove('playing'); void stage.offsetWidth; stage.classList.add('playing');
  }
  setTimeout(play, 200);
</script>
  <script src="./template-bridge.js"></script>
</body>
</html>
