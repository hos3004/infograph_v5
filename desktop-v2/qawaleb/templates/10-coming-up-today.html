<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>تشاهدون اليوم — Coming Up Today</title>
<style>
  @font-face{
    font-family:"QawalebArabic";
    src:url("../../../public/assets/fonts/alfont_com_AlFont_com_AvenirArabic-Heavy.otf") format("opentype");
    font-weight:700;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:"QawalebDisplay";
    src:url("../../../public/assets/fonts/rb.ttf") format("truetype");
    font-weight:700;
    font-style:normal;
    font-display:swap;
  }
  :root{
    --navy-1:#04102e;
    --navy-2:#0a1f5c;
    --blue:#1e4ba8;
    --blue-2:#3a6fd4;
    --cyan:#7ec2ff;
    --orange:#ff8a3d;
    --orange-2:#ffb066;
    --ink:#ffffff;
    --muted:#9bb0d8;
    --font-body:"QawalebArabic","Segoe UI",Tahoma,Arial,sans-serif;
    --font-display:"QawalebDisplay","QawalebArabic","Segoe UI",Tahoma,Arial,sans-serif;
    --font-mono:"Consolas","Courier New",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;color:var(--ink);overflow:hidden;font-family:var(--font-body)}
  .viewport{position:fixed;inset:0;display:grid;place-items:center;background:#000}
  .stage{
    width:1920px;height:1080px;
    transform-origin:center center;
    position:relative;overflow:hidden;
    background:
      radial-gradient(ellipse at 20% 90%, rgba(255,138,61,.12) 0%, transparent 45%),
      radial-gradient(ellipse at 80% 10%, rgba(122,180,255,.18) 0%, transparent 50%),
      linear-gradient(160deg, #04102e 0%, #0a1f5c 45%, #112a73 75%, #06143c 100%);
    perspective:1800px;
  }
  .bg-orbs{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .orb{position:absolute;border-radius:999px;filter:blur(80px);opacity:.6;mix-blend-mode:screen}
  .orb.a{width:680px;height:680px;background:radial-gradient(circle,#3a6fd4 0%,transparent 60%);top:-200px;left:-180px;animation:float1 18s ease-in-out infinite alternate}
  .orb.b{width:520px;height:520px;background:radial-gradient(circle,#ff8a3d 0%,transparent 60%);bottom:-160px;right:-120px;animation:float2 22s ease-in-out infinite alternate;opacity:.35}
  .orb.c{width:420px;height:420px;background:radial-gradient(circle,#7ec2ff 0%,transparent 60%);top:40%;right:30%;animation:float3 26s ease-in-out infinite alternate;opacity:.35}
  @keyframes float1{to{transform:translate(180px,120px) scale(1.15)}}
  @keyframes float2{to{transform:translate(-220px,-160px) scale(1.2)}}
  @keyframes float3{to{transform:translate(-260px,180px) scale(1.1)}}
  .mesh{position:absolute;inset:0;pointer-events:none;opacity:.18;
    background-image:
      linear-gradient(rgba(122,180,255,.5) 1px, transparent 1px),
      linear-gradient(90deg, rgba(122,180,255,.5) 1px, transparent 1px);
    background-size:90px 90px;
    mask-image:radial-gradient(ellipse at 50% 50%, black 0%, transparent 85%);
    transform:perspective(900px) rotateX(58deg) translateY(-10%) scale(2.4);
    animation:meshDrift 30s linear infinite;
  }
  @keyframes meshDrift{from{background-position:0 0}to{background-position:0 90px}}
  .particles{position:absolute;inset:0;pointer-events:none}
  .particles i{position:absolute;width:3px;height:3px;background:rgba(255,255,255,.7);border-radius:999px;box-shadow:0 0 12px rgba(255,255,255,.6);animation:rise linear infinite}
  @keyframes rise{
    from{transform:translateY(0) translateX(0);opacity:0}
    10%{opacity:1}
    90%{opacity:.8}
    to{transform:translateY(-1200px) translateX(var(--dx,0));opacity:0}
  }
  .grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.08;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .content-layer{position:absolute;inset:0;z-index:4;transform:translateY(-75px) scale(.9);transform-origin:center center}
  .header{position:absolute;top:64px;left:96px;right:96px;display:flex;justify-content:space-between;align-items:center;z-index:10}
  .brand{display:flex;align-items:center;gap:22px}
  .brand .glyph{width:72px;height:72px;border:2px solid var(--orange);position:relative;display:grid;place-items:center;background:rgba(255,138,61,.08);transform:rotate(45deg)}
  .brand .glyph::before{content:"";width:28px;height:28px;background:var(--orange)}
  .brand .glyph::after{content:"";position:absolute;inset:-10px;border:1px solid rgba(255,138,61,.3);animation:glyphSpin 12s linear infinite}
  @keyframes glyphSpin{to{transform:rotate(360deg)}}
  .brand .text .l2{font-family:var(--font-display);font-size:54px;line-height:1;color:#fff}
  .date-block{text-align:left;display:flex;align-items:center;gap:18px}
  .date-block .ico{width:14px;height:14px;border-radius:999px;background:var(--orange);box-shadow:0 0 24px var(--orange);animation:pulse 1.4s infinite}
  .date-block .text{font-size:22px;color:#fff;line-height:1.2}
  @keyframes pulse{50%{transform:scale(.6);opacity:.5}}
  .slides{position:absolute;top:180px;left:96px;right:96px;bottom:330px;z-index:5;perspective:2200px;perspective-origin:50% 50%}
  .slide{position:absolute;inset:0;display:grid;grid-template-columns:.95fr 1fr;gap:72px;align-items:center;opacity:0;pointer-events:none;transform:translateX(-110%);transform-origin:center center;transform-style:preserve-3d}
  .slide.active{pointer-events:auto}
  .slide .text-col{order:2}
  .slide .img-col{order:1}
  .img-stack{position:relative;width:100%;aspect-ratio:4/5;max-height:540px;margin-inline:auto;transform-style:preserve-3d}
  .img-stack .shadow{position:absolute;inset:30px 30px -40px;background:radial-gradient(ellipse,rgba(0,0,0,.5),transparent 70%);filter:blur(40px);transform:translateZ(-50px)}
  .frame{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
  .frame .photo-wrap{position:absolute;inset:0;overflow:hidden;border-radius:220px 32px 220px 32px;box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08) inset,0 0 80px rgba(122,180,255,.2);background:#0a1230}
  .frame .photo-wrap img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);will-change:transform}
  .frame .photo-wrap::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(4,16,46,.5) 100%),linear-gradient(135deg,rgba(122,180,255,.2),transparent 40%)}
  .frame .corner-tl,.frame .corner-br{position:absolute;width:18px;height:18px;border-radius:999px;background:var(--orange);box-shadow:0 0 24px var(--orange);pointer-events:none;z-index:4}
  .frame .corner-tl{top:38px;right:50%;transform:translateX(50%)}
  .frame .corner-br{bottom:38px;left:50%;transform:translateX(-50%)}
  .frame .arc{position:absolute;inset:-14px;border-radius:240px 32px 240px 32px;border:1px solid rgba(255,138,61,.45);pointer-events:none;z-index:2}
  .frame.back{transform:translate(60px,40px) translateZ(-80px) rotate(6deg);opacity:.45}
  .frame.back .photo-wrap{background:transparent;box-shadow:0 0 0 2px rgba(255,138,61,.55) inset;border-radius:220px 32px 220px 32px}
  .ep-badge{position:absolute;top:-30px;right:-30px;z-index:3;background:var(--orange);color:#1a0a02;font-family:var(--font-display);font-size:24px;padding:14px 26px;box-shadow:0 14px 40px rgba(255,138,61,.5);transform:rotate(-4deg);white-space:nowrap}
  .ep-badge::before{content:"";position:absolute;inset:-6px;border:1px solid rgba(255,138,61,.5);transform:rotate(2deg)}
  .text-col{padding-left:20px;min-width:0;max-width:880px}
  .kicker{display:inline-flex;align-items:center;gap:14px;padding:10px 22px;background:rgba(255,138,61,.12);border:1px solid rgba(255,138,61,.5);color:var(--orange);font-size:22px;letter-spacing:.16em;text-transform:uppercase;border-radius:999px;margin-bottom:36px}
  .kicker .dot{width:8px;height:8px;border-radius:999px;background:var(--orange);box-shadow:0 0 16px var(--orange);animation:pulse 1.2s infinite}
  .title{font-family:var(--font-display);font-size:76px;line-height:1.04;color:#fff;text-wrap:balance;text-shadow:0 4px 40px rgba(0,0,0,.5);max-width:100%}
  .title .em{color:var(--orange)}
  .desc{margin-top:32px;color:#cfddff;font-size:26px;line-height:1.55;max-width:100%;text-wrap:pretty}
  .meta-row{margin-top:48px;display:flex;align-items:center;gap:48px;flex-wrap:wrap}
  .time-card{display:flex;align-items:center;gap:22px;padding:22px 36px;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);border-radius:18px;backdrop-filter:blur(10px)}
  .time-card .clock{width:60px;height:60px;border:2px solid var(--orange);border-radius:999px;display:grid;place-items:center;position:relative}
  .time-card .clock::before,.time-card .clock::after{content:"";position:absolute;background:var(--orange);border-radius:2px;transform-origin:bottom center}
  .time-card .clock::before{width:2px;height:18px;bottom:30px;left:calc(50% - 1px);transform:rotate(45deg)}
  .time-card .clock::after{width:2px;height:14px;bottom:30px;left:calc(50% - 1px);transform:rotate(135deg)}
  .time-card .t-text .lbl{font-family:var(--font-mono);font-size:14px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px}
  .time-card .t-text .val{font-family:var(--font-display);font-size:40px;color:#fff;line-height:1}
  .host{font-size:24px;color:#fff;display:flex;align-items:center;gap:14px}
  .host .lbl{color:var(--muted);font-family:var(--font-mono);font-size:14px;letter-spacing:.2em;text-transform:uppercase}
  .host .bar{width:2px;height:32px;background:var(--orange)}
  .slide.active .kicker{animation:slideRight .7s .75s cubic-bezier(.2,.8,.2,1) both}
  .slide.active .title{animation:titleIn 1s .85s cubic-bezier(.2,.8,.2,1) both}
  .slide.active .desc{animation:slideRight .8s 1.25s cubic-bezier(.2,.8,.2,1) both}
  .slide.active .meta-row{animation:slideRight .8s 1.45s cubic-bezier(.2,.8,.2,1) both}
  .slide.active .img-stack{animation:imgIn 1s .6s cubic-bezier(.2,.8,.2,1) both,breathe 8s 1.7s ease-in-out infinite alternate}
  .slide.active .img-stack .frame.front .photo-wrap img{animation:kenburns 11s .6s ease-out both}
  .slide.active .ep-badge{animation:badgeIn .6s 1.5s cubic-bezier(.34,1.56,.64,1) both}
  .slide.active .frame.back{animation:backIn 1.2s .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes slideRight{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
  @keyframes titleIn{from{opacity:0;transform:translateX(60px);filter:blur(12px)}to{opacity:1;transform:translateX(0);filter:blur(0)}}
  @keyframes imgIn{from{opacity:0;transform:translateX(-40px) scale(.92)}to{opacity:1;transform:translateX(0) scale(1)}}
  @keyframes breathe{0%{transform:rotateY(-3deg) rotateX(1deg) scale(1)}50%{transform:rotateY(3deg) rotateX(-1deg) scale(1.015)}100%{transform:rotateY(-2deg) rotateX(2deg) scale(1.005)}}
  @keyframes kenburns{from{transform:scale(1.08) translate(0,0)}to{transform:scale(1.2) translate(-2%,1%)}}
  @keyframes badgeIn{from{opacity:0;transform:rotate(8deg) scale(.5) translateY(-30px)}to{opacity:1;transform:rotate(-4deg) scale(1) translateY(0)}}
  @keyframes backIn{from{opacity:0;transform:translate(80px,60px) translateZ(-80px)}to{opacity:.5;transform:translate(40px,30px) translateZ(-80px)}}
  .timeline{position:absolute;left:64px;right:64px;bottom:48px;height:212px;z-index:10}
  .timeline .progress-line{position:absolute;left:0;right:0;top:128px;height:2px;background:rgba(255,255,255,.1);overflow:hidden;border-radius:999px}
  .timeline .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--orange),var(--orange-2));border-radius:999px;box-shadow:0 0 16px var(--orange)}
  .pins{position:relative;display:flex;align-items:flex-end;justify-content:space-around;height:140px;gap:8px}
  .pin{position:relative;width:120px;height:140px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;transform:translateY(0);transition:transform .55s cubic-bezier(.34,1.4,.64,1),opacity .35s ease;opacity:.55}
  .pin .balloon{position:relative;width:80px;height:80px;border-radius:999px;background:var(--pin-color,var(--orange));display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.4),0 0 0 4px rgba(255,255,255,.06) inset;transition:all .55s cubic-bezier(.34,1.4,.64,1)}
  .pin .balloon::after{content:"";position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:26px solid var(--pin-color,var(--orange));filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
  .pin .thumb{width:62px;height:62px;border-radius:999px;overflow:hidden;background:#0a1230;border:2px solid rgba(255,255,255,.85);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
  .pin .thumb img{width:100%;height:100%;object-fit:cover}
  .pin .pin-num{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#fff;color:#04102e;font-family:var(--font-mono);font-size:13px;padding:3px 10px;border-radius:999px;letter-spacing:.04em;opacity:0;transition:opacity .3s ease;box-shadow:0 4px 10px rgba(0,0,0,.3)}
  .pin.active{opacity:1;transform:translateY(-26px)}
  .pin.active .balloon{width:96px;height:96px;box-shadow:0 14px 30px rgba(0,0,0,.45),0 0 0 4px rgba(255,255,255,.16) inset,0 0 50px var(--pin-color,var(--orange))}
  .pin.active .balloon::after{border-left-width:22px;border-right-width:22px;border-top-width:32px}
  .pin.active .thumb{width:78px;height:78px;border-width:3px}
  .pin.active .pin-num{opacity:1;top:-18px}
  .chevrons{display:flex;height:48px;margin-top:6px;align-items:stretch;gap:0}
  .chev{flex:1;display:flex;align-items:center;justify-content:center;background:var(--pin-color,var(--orange));color:rgba(255,255,255,.95);font-family:var(--font-display);font-size:18px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%,18px 50%);margin-left:-16px;opacity:.55;transition:opacity .35s ease,filter .35s ease;position:relative}
  .chev:first-child{clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%);margin-left:0}
  .chev:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,18px 50%)}
  .chev.active{opacity:1;filter:brightness(1.1) saturate(1.15)}
  .chev .label{font-family:var(--font-mono);font-size:18px;letter-spacing:.08em}
  .panel{position:fixed;left:24px;bottom:24px;z-index:50;background:rgba(10,15,30,.96);border:1px solid #2a3a60;backdrop-filter:blur(14px);color:#eee;padding:16px;border-radius:16px;width:520px;max-height:calc(100vh - 48px);overflow:auto;font-family:var(--font-body);font-size:14px;box-shadow:0 30px 60px rgba(0,0,0,.6);transition:transform .3s ease}
  .panel.collapsed{transform:translateY(calc(100% - 60px))}
  .panel h3{display:flex;justify-content:space-between;align-items:center;font-size:16px;margin-bottom:14px;cursor:pointer}
  .panel label{display:block;color:#9bb0d8;font-size:11px;margin-bottom:4px;letter-spacing:.04em;text-transform:uppercase;font-family:var(--font-mono)}
  .panel input,.panel textarea{width:100%;background:#0a0f1f;border:1px solid #2a3a60;color:#eee;padding:9px 11px;border-radius:8px;font-family:inherit;font-size:13px;resize:vertical}
  .panel textarea{min-height:54px}
  .panel .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .panel .prog-card{background:#0a0f1f;border:1px solid #2a3a60;border-radius:10px;padding:12px;margin-bottom:10px}
  .panel .head{font-family:var(--font-mono);color:var(--orange);font-size:12px;letter-spacing:.16em;margin-bottom:10px}
  .panel .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .panel .btn{display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#1a0a02;border:0;padding:9px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-family:var(--font-display)}
  .panel .btn.ghost{background:#1a2240;color:#fff;border:1px solid #2a3a60}
</style>
</head>
<body>
<div class="viewport">
  <div class="stage" id="stage">
    <div class="bg-orbs"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>
    <div class="mesh"></div>
    <div class="particles" id="particles"></div>
    <div class="grain"></div>
    <div class="content-layer">
      <div class="header">
        <div class="brand">
          <div class="glyph"></div>
          <div class="text"><div class="l2">تشاهدون اليوم</div></div>
        </div>
        <div class="date-block">
          <span class="ico"></span>
          <div class="text"><span id="hdr-date">الجمعة · ١٥ مايو ٢٠٢٦</span></div>
        </div>
      </div>
      <div class="slides" id="slides"></div>
      <div class="timeline">
        <div class="progress-line" id="progress-line"><div class="fill"></div></div>
        <div class="pins" id="pins"></div>
        <div class="chevrons" id="chevrons"></div>
      </div>
    </div>
  </div>
</div>

<div class="panel" id="panel">
  <h3 onclick="document.getElementById('panel').classList.toggle('collapsed')"><span>لوحة التحكم — تشاهدون اليوم</span><span>▾</span></h3>
  <div class="row">
    <div><label>التاريخ في الترويسة</label><input id="i-date" value="الجمعة · ١٥ مايو ٢٠٢٦" /></div>
    <div></div>
  </div>
  <div class="row">
    <div><label>مدة البرنامج (ثانية)</label><input id="i-dur" type="number" min="4" max="20" step="1" value="10" /></div>
    <div></div>
  </div>

  <div class="prog-card">
    <div class="head">برنامج 01</div>
    <div class="row"><div><label>الكيكر</label><input id="i-p1-kicker" value="حلقة جديدة" /></div><div><label>الوقت</label><input id="i-p1-time" value="21:00" /></div></div>
    <div><label>العنوان</label><input id="i-p1-title" value="نشرة {الأخبار} الرئيسية" /></div>
    <div style="margin-top:6px"><label>الوصف</label><textarea id="i-p1-desc">أبرز عناوين اليوم محلياً وعربياً ودولياً، مع تحليلٍ مباشر من نخبة المراسلين في عواصم الحدث.</textarea></div>
    <div class="row" style="margin-top:6px"><div><label>الحلقة</label><input id="i-p1-ep" value="حلقة 412" /></div><div><label>المقدّم</label><input id="i-p1-host" value="تقديم: ليلى الحسن" /></div></div>
    <div style="margin-top:6px"><label>رابط الصورة</label><input id="i-p1-img" value="https://images.unsplash.com/photo-1495020689067-958852a7765e?w=1400&q=80" /></div>
  </div>
  <div class="prog-card">
    <div class="head">برنامج 02</div>
    <div class="row"><div><label>الكيكر</label><input id="i-p2-kicker" value="حصري" /></div><div><label>الوقت</label><input id="i-p2-time" value="22:30" /></div></div>
    <div><label>العنوان</label><input id="i-p2-title" value="حوار {خاص} مع الضيف" /></div>
    <div style="margin-top:6px"><label>الوصف</label><textarea id="i-p2-desc">لقاء مطوّل مع شخصية تصنع الحدث، يفتح ملفات لم تُطرح من قبل ويكشف عن مواقف غير مسبوقة.</textarea></div>
    <div class="row" style="margin-top:6px"><div><label>الحلقة</label><input id="i-p2-ep" value="موسم 03" /></div><div><label>المقدّم</label><input id="i-p2-host" value="تقديم: عمر النجار" /></div></div>
    <div style="margin-top:6px"><label>رابط الصورة</label><input id="i-p2-img" value="https://images.unsplash.com/photo-1573164713988-8665fc963095?w=1400&q=80" /></div>
  </div>
  <div class="prog-card">
    <div class="head">برنامج 03</div>
    <div class="row"><div><label>الكيكر</label><input id="i-p3-kicker" value="تحقيق" /></div><div><label>الوقت</label><input id="i-p3-time" value="00:00" /></div></div>
    <div><label>العنوان</label><input id="i-p3-title" value="ملف {اليوم}" /></div>
    <div style="margin-top:6px"><label>الوصف</label><textarea id="i-p3-desc">تحقيقٌ ميداني يأخذكم إلى قلب المشهد، حيث الكاميرا لا تنام والأسئلة الكبرى لا تتوقف.</textarea></div>
    <div class="row" style="margin-top:6px"><div><label>الحلقة</label><input id="i-p3-ep" value="حلقة 28" /></div><div><label>المقدّم</label><input id="i-p3-host" value="تقديم: سارة المصري" /></div></div>
    <div style="margin-top:6px"><label>رابط الصورة</label><input id="i-p3-img" value="https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=1400&q=80" /></div>
  </div>
  <div class="prog-card">
    <div class="head">برنامج 04</div>

    <div class="row"><div><label>الكيكر</label><input id="i-p8-kicker" value="" /></div><div><label>الوقت</label><input id="i-p8-time" value="" /></div></div>

    <div class="row" style="margin-top:6px"><div><label>الحلقة</label><input id="i-p8-ep" value="" /></div><div><label>المقدّم</label><input id="i-p8-host" value="" /></div></div>

  <div class="actions">
    <button class="btn" onclick="play(true)">▶ تشغيل من جديد</button>
    <button class="btn ghost" id="pauseBtn" onclick="togglePause()">⏸ إيقاف</button>

</div>

<script>
  const EMBED_MODE = new URLSearchParams(window.location.search).get('embed') === '1';
  const PIN_COLORS = ['#ff8a3d','#3a6fd4','#ec4899','#a855f7','#10b981','#f5d000','#14b8a6','#ef4444'];
  let state = {duration:10,headerDate:'',programs:[]};
  let cur = 0, timer = null, paused = EMBED_MODE, progressAnim = null;

  const $ = (id)=>document.getElementById(id);
  const valueOf = (id,fallback='')=>{
    const el = $(id);
    return el && 'value' in el && el.value !== '' ? el.value : fallback;
  };
  const escapeHtml = (value)=>String(value || '').replace(/[&<>"']/g,(ch)=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
  const titleHtml = (value)=>escapeHtml(value).replace(/\{([^}]+)\}/g,'<span class="em">$1</span>');

  function fit(){
    const stage = $('stage');
    const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `scale(${scale})`;
  }
  addEventListener('resize', fit); fit();

  (function makeParticles(){
    const root = $('particles');
    for(let i=0;i<60;i++){
      const p = document.createElement('i');
      const x = (i * 337) % 1920;
      const dur = 14 + ((i * 29) % 22);
      const delay = -((i * 17) % 30);
      const dx = ((i * 53) % 200) - 100;
      const size = 1 + ((i * 7) % 3);
      p.style.left = x + 'px';
      p.style.top = (1080 + ((i * 71) % 200)) + 'px';
      p.style.setProperty('--dx', dx + 'px');
      p.style.animationDuration = dur + 's';
      p.style.animationDelay = delay + 's';
      p.style.opacity = .3 + (((i * 11) % 50) / 100);
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      root.appendChild(p);
    }
  })();

  function readPrograms(){
    const programs = [];
    for(let i=1;i<=8;i++){
      const item = {
        kicker:valueOf(`i-p${i}-kicker`),
        title:valueOf(`i-p${i}-title`),
        desc:valueOf(`i-p${i}-desc`),
        time:valueOf(`i-p${i}-time`),
        ep:valueOf(`i-p${i}-ep`),
        host:valueOf(`i-p${i}-host`),
        img:valueOf(`i-p${i}-img`)
      };
      if(item.title || item.desc || item.img) programs.push(item);
    }
    return programs.length ? programs : [{
      kicker:'تشاهدون',title:'تشاهدون {اليوم}',desc:'قائمة برامج اليوم على الشاشة.',time:'21:00',ep:'حلقة 01',host:'تقديم: فريق التحرير',img:''
    }];
  }

  function buildSlides(){
    const root = $('slides');
    root.innerHTML = '';
    state.programs.forEach((p)=>{
      const el = document.createElement('div');
      el.className = 'slide';
      el.innerHTML = `
        <div class="img-col">
          <div class="img-stack">
            <div class="shadow"></div>
            <div class="frame back"><div class="photo-wrap"></div></div>
            <div class="frame front">
              <div class="ep-badge">${escapeHtml(p.ep)}</div>
              <span class="arc"></span>
              <div class="photo-wrap"><img src="${escapeHtml(p.img)}" alt="" /></div>
              <span class="corner-tl"></span><span class="corner-br"></span>
            </div>
          </div>
        </div>
        <div class="text-col">
          <div class="kicker"><span class="dot"></span><span>${escapeHtml(p.kicker || 'تشاهدون')}</span></div>
          <h2 class="title">${titleHtml(p.title)}</h2>
          <p class="desc">${escapeHtml(p.desc)}</p>
          <div class="meta-row">
            <div class="time-card">
              <div class="clock"></div>
              <div class="t-text"><div class="lbl">على الهواء</div><div class="val">${escapeHtml(p.time)}</div></div>
            </div>
            <div class="host"><span class="bar"></span><div><div class="lbl">PRESENTED BY</div>${escapeHtml(p.host)}</div></div>
          </div>
        </div>`;
      root.appendChild(el);
    });
  }

  function buildTimeline(progress=0){
    const pinsRoot = $('pins');
    const chevRoot = $('chevrons');
    pinsRoot.innerHTML = '';
    chevRoot.innerHTML = '';
    state.programs.forEach((p,i)=>{
      const color = PIN_COLORS[i % PIN_COLORS.length];
      const pin = document.createElement('div');
      pin.className = 'pin' + (i === cur ? ' active' : '');
      pin.style.setProperty('--pin-color', color);
      pin.innerHTML = `<span class="pin-num">0${i+1}</span><div class="balloon"><div class="thumb"><img src="${escapeHtml(p.img)}" alt="" /></div></div>`;
      pin.onclick = ()=>goto(i);
      pinsRoot.appendChild(pin);
      const chev = document.createElement('div');
      chev.className = 'chev' + (i === cur ? ' active' : '');
      chev.style.setProperty('--pin-color', color);
      chev.innerHTML = `<span class="label">${escapeHtml(p.time || `0${i+1}`)}</span>`;
      chev.onclick = ()=>goto(i);
      chevRoot.appendChild(chev);
    });
    const fill = document.querySelector('#progress-line .fill');
    if(fill) fill.style.width = `${Math.max(0, Math.min(1, progress)) * 100}%`;
  }

  function flipSlide(slide,direction){
    slide.getAnimations({subtree:false}).forEach((a)=>{ if(a.id === 'slideFlip') a.cancel(); });
    const inFrames = [
      {opacity:0,transform:'translateX(-110%) rotateY(28deg) scale(.94)',offset:0},
      {opacity:1,transform:'translateX(-40%) rotateY(10deg) scale(.97)',offset:.5},
      {opacity:1,transform:'translateX(0) rotateY(0deg) scale(1)',offset:1}
    ];
    const outFrames = [
      {opacity:1,transform:'translateX(0) rotateY(0deg) scale(1)',offset:0},
      {opacity:1,transform:'translateX(40%) rotateY(-10deg) scale(.97)',offset:.5},
      {opacity:0,transform:'translateX(110%) rotateY(-28deg) scale(.94)',offset:1}
    ];
    const anim = slide.animate(direction === 'in' ? inFrames : outFrames,{duration:direction === 'in' ? 900 : 750,easing:'cubic-bezier(.55,.05,.25,1)',fill:'forwards'});
    anim.id = 'slideFlip';
    return anim;
  }

  function restartProgress(progress=0){
    const fill = document.querySelector('#progress-line .fill');
    if(!fill) return;
    if(progressAnim){ try{progressAnim.cancel()}catch{} }
    clearTimeout(timer);
    const clamped = Math.max(0, Math.min(1, progress));
    fill.style.width = `${clamped * 100}%`;
    if(paused) return;
    const remaining = Math.max(150, (1 - clamped) * state.duration * 1000);
    progressAnim = fill.animate([{width:`${clamped * 100}%`},{width:'100%'}],{duration:remaining,fill:'forwards',easing:'linear'});
    timer = setTimeout(next, remaining);
  }

  function show(i, animateExit, progress=0){
    const slides = document.querySelectorAll('.slide');
    if(!slides.length) return;
    i = Math.max(0, Math.min(i, slides.length - 1));
    slides.forEach((s,idx)=>{
      if(idx === i) return;
      const wasActive = s.classList.contains('active');
      s.classList.remove('active');
      if(wasActive && animateExit){
        flipSlide(s,'out').finished.catch(()=>{});
      } else {
        s.getAnimations({subtree:false}).forEach((a)=>{ if(a.id === 'slideFlip') a.cancel(); });
      }
    });
    const delay = animateExit ? 450 : 0;
    setTimeout(()=>{
      const target = slides[i];
      target.classList.add('active');
      flipSlide(target,'in');
      cur = i;
      buildTimeline(progress);
      restartProgress(progress);
    }, delay);
  }

  function next(){ show((cur + 1) % state.programs.length, true, 0); }
  function goto(i){ if(i === cur) return; show(i, true, 0); }

  function render(){
    state.duration = Math.max(4, Math.min(20, Number(valueOf('i-dur','10')) || 10));
    state.headerDate = valueOf('i-date','الجمعة · ١٥ مايو ٢٠٢٦');
    state.programs = readPrograms();
    $('hdr-date').textContent = state.headerDate;
    buildSlides();
    cur = Math.min(cur, state.programs.length - 1);
    buildTimeline(0);
  }

  function play(autoplay=true){
    paused = autoplay === false;
    cur = 0;
    render();
    requestAnimationFrame(()=>show(0,false,0));
  }

  function togglePause(){
    paused = !paused;
    $('pauseBtn').textContent = paused ? '▶ متابعة' : '⏸ إيقاف';
    if(paused){
      clearTimeout(timer);
      if(progressAnim){ try{progressAnim.pause()}catch{} }
      getAnimations().forEach((a)=>{ try{a.pause()}catch{} });
    } else {
      getAnimations().forEach((a)=>{ try{a.play()}catch{} });
      restartProgress(0);
    }
  }

  function getAnimations(){
    if(typeof document.getAnimations !== 'function') return [];
    try{return document.getAnimations({subtree:true});}catch{return document.getAnimations();}
  }

  function seekTo(timeMs=0, playing=false){
    render();
    const slideMs = state.duration * 1000;
    const safeTime = Math.max(0, Number(timeMs) || 0);
    const idx = Math.floor(safeTime / slideMs) % state.programs.length;
    const localProgress = (safeTime % slideMs) / slideMs;
    paused = playing !== true;
    show(idx,false,localProgress);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      getAnimations().forEach((a)=>{
        try{
          a.pause();
          a.currentTime = safeTime % slideMs;
          if(playing) a.play();
        }catch{}
      });
    }));
  }

  function applyValues(values){
    if(!values || typeof values !== 'object') return;
    Object.entries(values).forEach(([id,value])=>{
      const control = $(id);
      if(control && 'value' in control) control.value = value ?? '';
    });
  }

  function hideControlsInEmbedMode(){
    if(!EMBED_MODE) return;
    const panel = $('panel');
    if(panel) panel.style.display = 'none';
    const stage = $('stage');
    const viewport = document.querySelector('.viewport');
    const fitEmbedded = ()=>{
      const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      viewport.style.position = 'fixed';
      viewport.style.inset = '0';
      viewport.style.display = 'block';
      viewport.style.overflow = 'hidden';
      stage.style.position = 'absolute';
      stage.style.left = '50%';
      stage.style.top = '50%';
      stage.style.margin = '0';
      stage.style.transformOrigin = 'center center';
      stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
    };
    window.removeEventListener('resize', fit);
    window.addEventListener('resize', fitEmbedded);
    fitEmbedded();
  }

  function handleMessage(event){
    const data = event && event.data;
    if(!data || typeof data !== 'object') return;
    switch(data.type){
      case 'qawaleb:update':
        applyValues(data.values);
        seekTo(data.timeMs || 0, data.autoplay === true);
        break;
      case 'qawaleb:restart':
        seekTo(0, data.autoplay === true);
        break;
      case 'qawaleb:seek':
        seekTo(data.timeMs || 0, data.playing === true);
        break;
      case 'qawaleb:set-playing':
        paused = data.playing !== true;
        if(paused){
          clearTimeout(timer);
          if(progressAnim){ try{progressAnim.pause()}catch{} }
          getAnimations().forEach((a)=>{ try{a.pause()}catch{} });
        } else {
          getAnimations().forEach((a)=>{ try{a.play()}catch{} });
          restartProgress(0);
        }
        break;
    }
  }

  hideControlsInEmbedMode();
  window.addEventListener('message', handleMessage);
  window.render = render;
  window.play = play;
  window.QAWALEB_TEMPLATE_BRIDGE = {
    applyValues,
    renderNow: render,
    restart: (autoplay=true)=>seekTo(0, autoplay),
    seek: (timeMs, playing=false)=>seekTo(timeMs, playing),
    setPlaying: (playing)=>handleMessage({data:{type:'qawaleb:set-playing',playing}})
  };

  document.querySelectorAll('.panel input,.panel textarea').forEach((el)=>el.addEventListener('input',()=>play(!paused)));
  render();
  if(EMBED_MODE){
    seekTo(0, false);
  } else {
    setTimeout(()=>play(true), 200);
  }
  if(window.parent && window.parent !== window) window.parent.postMessage({type:'qawaleb:ready'}, '*');
</script>
