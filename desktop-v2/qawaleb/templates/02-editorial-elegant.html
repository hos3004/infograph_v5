<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>التقرير · Editorial Elegant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Reem+Kufi:wght@400;500;600&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f3eee2;
    --bg-2:#ebe4d2;
    --ink:#10182b;
    --ink-2:#3a3528;
    --muted:#7a6e58;
    --gold:#b08d57;
    --gold-deep:#8a6a3a;
    --rule:#c8bda0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;color:var(--ink);overflow:hidden;font-family:"Reem Kufi",system-ui}
  .viewport{position:fixed;inset:0;display:grid;place-items:center;background:#0a0a0a}
  .stage{
    width:1920px;height:1080px;
    transform-origin:center center;
    position:relative;overflow:hidden;
    background:
      radial-gradient(ellipse at 80% 20%, #fff8e8 0%, transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  }

  /* Paper texture */
  .paper{position:absolute;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 0.4  0 0 0 0 0.35  0 0 0 0 0.2  0 0 0 0.18 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* Masthead — top */
  .masthead{position:absolute;top:0;left:0;right:0;height:108px;
    border-bottom:1px solid var(--rule);
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 80px;
    background:rgba(243,238,226,.4);backdrop-filter:blur(2px);
    opacity:0;transform:translateY(-100%);
  }
  .masthead .left{display:flex;align-items:center;gap:18px;color:var(--muted);font-family:"Roboto Mono";font-size:18px;letter-spacing:.14em;text-transform:uppercase}
  .masthead .left .dotline{display:inline-block;width:40px;height:1px;background:var(--gold)}
  .masthead .brand{font-family:"Amiri";font-weight:700;font-size:54px;color:var(--ink);letter-spacing:.02em}
  .masthead .brand .em{color:var(--gold-deep);font-style:italic}
  .masthead .right{justify-self:end;color:var(--muted);font-family:"Roboto Mono";font-size:18px;letter-spacing:.14em;text-transform:uppercase}

  /* Two-column body */
  .layout{position:absolute;top:160px;bottom:160px;left:80px;right:80px;display:grid;grid-template-columns:1fr 1.05fr;gap:80px}

  /* Image on the left — gold thin frame */
  .frame{
    position:relative;background:var(--bg-2);
    opacity:0;transform:translateY(20px);
  }
  .frame .img-wrap{position:absolute;inset:18px;overflow:hidden;background:#ddd}
  .frame .img-wrap img{width:100%;height:100%;object-fit:cover;
    transform:scale(1.08);animation:burns 14s ease-out infinite alternate;
  }
  .frame::before,.frame::after{content:"";position:absolute;background:var(--gold);}
  .frame::before{top:0;left:0;right:0;height:1px}
  .frame::after{bottom:0;left:0;right:0;height:1px}
  .frame .side-l,.frame .side-r{position:absolute;top:0;bottom:0;width:1px;background:var(--gold)}
  .frame .side-l{left:0}.frame .side-r{right:0}
  .frame .corner{position:absolute;width:22px;height:22px;border:2px solid var(--gold-deep)}
  .frame .c1{top:-2px;left:-2px;border-right:0;border-bottom:0}
  .frame .c2{top:-2px;right:-2px;border-left:0;border-bottom:0}
  .frame .c3{bottom:-2px;left:-2px;border-right:0;border-top:0}
  .frame .c4{bottom:-2px;right:-2px;border-left:0;border-top:0}
  .frame .caption{position:absolute;left:18px;right:18px;bottom:-44px;font-family:"Reem Kufi";font-size:18px;color:var(--muted);letter-spacing:.04em;opacity:0;transform:translateY(8px)}

  /* Right column — article */
  .article{padding-top:6px}
  .section{display:flex;align-items:center;gap:18px;margin-bottom:36px;opacity:0;transform:translateY(12px)}
  .section .num{font-family:"Roboto Mono";color:var(--gold-deep);font-size:18px;letter-spacing:.18em}
  .section .rule{flex:1;height:1px;background:var(--rule)}
  .section .tag{font-family:"Reem Kufi";font-weight:500;color:var(--muted);letter-spacing:.18em;font-size:18px;text-transform:uppercase}

  .title{
    font-family:"Amiri";font-weight:700;color:var(--ink);
    font-size:104px;line-height:1.06;letter-spacing:-.01em;
    text-wrap:balance;
  }
  .title .ln{display:block;overflow:hidden}
  .title .ln span{display:block;transform:translateY(110%)}

  .deck{margin-top:30px;font-family:"Amiri";font-style:italic;font-weight:400;color:var(--ink-2);
    font-size:36px;line-height:1.45;max-width:780px;opacity:0;transform:translateY(8px)}

  .meta{margin-top:40px;display:flex;align-items:center;gap:24px;opacity:0}
  .meta .author{font-family:"Reem Kufi";font-weight:500;font-size:22px;color:var(--ink)}
  .meta .sep{width:6px;height:6px;border-radius:999px;background:var(--gold)}
  .meta .src{font-family:"Roboto Mono";font-size:16px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}

  /* Footer */
  .foot{position:absolute;left:80px;right:80px;bottom:48px;
    display:flex;justify-content:space-between;align-items:center;
    padding-top:24px;border-top:1px solid var(--rule);
    color:var(--muted);font-family:"Roboto Mono";font-size:18px;letter-spacing:.14em;text-transform:uppercase;
    opacity:0;transform:translateY(12px);
  }
  .foot .page{display:flex;align-items:center;gap:12px}
  .foot .pageno{font-family:"Amiri";font-style:italic;color:var(--gold-deep);font-size:24px}

  /* Decorative initial */
  .initial{position:absolute;left:80px;top:230px;font-family:"Amiri";font-weight:700;font-size:280px;line-height:1;color:var(--gold);opacity:0;pointer-events:none;transform:scale(.7) rotate(-4deg);transform-origin:left top}

  /* Activation */
  .playing .masthead{animation:fadeDown .9s .1s cubic-bezier(.2,.8,.2,1) forwards}
  .playing .frame{animation:rise 1s .55s cubic-bezier(.2,.8,.2,1) forwards}
  .playing .frame .caption{animation:rise .8s 1.6s cubic-bezier(.2,.8,.2,1) forwards}
  .playing .section{animation:rise .8s .85s cubic-bezier(.2,.8,.2,1) forwards}
  .playing .title .ln span{animation:lineUp .9s cubic-bezier(.2,.8,.2,1) forwards}
  .playing .deck{animation:rise 1s 2.2s cubic-bezier(.2,.8,.2,1) forwards}
  .playing .meta{animation:rise .8s 2.8s cubic-bezier(.2,.8,.2,1) forwards}
  .playing .foot{animation:rise .8s 1.4s cubic-bezier(.2,.8,.2,1) forwards}
  .playing .initial{animation:initialIn 1.4s 1.0s cubic-bezier(.2,.8,.2,1) forwards}

  @keyframes fadeDown{to{opacity:1;transform:translateY(0)}}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  @keyframes lineUp{to{transform:translateY(0)}}
  @keyframes initialIn{to{opacity:.10;transform:scale(1) rotate(0)}}
  @keyframes burns{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-2%, -1.5%)}}

  /* Controls */
  .controls{position:fixed;left:24px;bottom:24px;z-index:50;
    background:rgba(20,20,20,.92);border:1px solid #2a2a2a;backdrop-filter:blur(10px);
    color:#eee;padding:14px;border-radius:14px;width:420px;
    font-family:"Reem Kufi";font-size:14px;box-shadow:0 30px 60px rgba(0,0,0,.6);transition:transform .3s ease;
  }
  .controls.collapsed{transform:translateY(calc(100% - 56px))}
  .controls h3{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:16px;margin-bottom:10px;cursor:pointer}
  .controls h3 .chev{color:#888;font-family:"Roboto Mono"}
  .controls label{display:block;color:#aaa;font-size:11px;margin-bottom:4px;letter-spacing:.04em;text-transform:uppercase;font-family:"Roboto Mono"}
  .controls input,.controls textarea{width:100%;background:#0d0d0d;border:1px solid #2a2a2a;color:#eee;padding:9px 11px;border-radius:8px;font-family:inherit;font-size:14px;resize:vertical}
  .controls textarea{min-height:64px}
  .controls .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .controls .grid{display:grid;gap:10px}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:#1a1407;border:0;padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer}
  .btn:hover{background:#c9a06d}
  .btn.ghost{background:#222;color:#eee}
</style>
</head>
<body>
<div class="viewport">
  <div class="stage" id="stage">
    <div class="paper"></div>

    <div class="masthead">
      <div class="left"><span class="dotline"></span><span id="brand-tag">التقرير الأسبوعي</span></div>
      <div class="brand">المقالـ<span class="em">ـة</span></div>
      <div class="right" id="brand-date">٢٢ شعبان / المجلد ٧</div>
    </div>

    <div class="initial">ا</div>

    <div class="layout">
      <div class="frame">
        <span class="side-l"></span><span class="side-r"></span>
        <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
        <div class="img-wrap"><img id="photo" src="" alt="" /></div>
        <div class="caption" id="caption">— تصوير: عدسة المراسل الميداني</div>
      </div>

      <div class="article">
        <div class="section">
          <span class="num">٠١</span>
          <span class="rule"></span>
          <span class="tag" id="tag">قضية الأسبوع</span>
        </div>

        <h1 class="title" id="title"></h1>

        <p class="deck" id="deck"></p>

        <div class="meta">
          <span class="author" id="author">بقلم — هيئة التحرير</span>
          <span class="sep"></span>
          <span class="src" id="source">Source · Reuters</span>
        </div>
      </div>
    </div>

    <div class="foot">
      <div class="page"><span>قسم الأخبار العالمية</span></div>
      <div class="pageno" id="pageno">— صفحة ٠١ —</div>
      <div>مايو ٢٠٢٦</div>
    </div>
  </div>
</div>

<div class="controls" id="controls">
  <h3 onclick="document.getElementById('controls').classList.toggle('collapsed')"><span>لوحة التحكم — Editorial</span><span class="chev">▾</span></h3>
  <div class="grid">
    <div><label>العنوان</label><textarea id="i-title">مفاوضات سرية تعيد رسم خريطة التحالفات في الشرق الأوسط</textarea></div>
    <div><label>المقدمة (Deck)</label><textarea id="i-deck">وثائق حصرية اطّلعت عليها هيئة التحرير تكشف عن لقاءات متواصلة بين ثلاث عواصم، قد تُغيّر موازين القوى في المنطقة خلال الأشهر القليلة المقبلة.</textarea></div>
    <div class="row">
      <div><label>التصنيف</label><input id="i-tag" value="قضية الأسبوع" /></div>
      <div><label>التعليق</label><input id="i-caption" value="— تصوير: عدسة المراسل الميداني" /></div>
    </div>
    <div class="row">
      <div><label>الكاتب</label><input id="i-author" value="بقلم — هيئة التحرير" /></div>
      <div><label>المصدر</label><input id="i-source" value="Source · Reuters" /></div>
    </div>
    <div><label>رابط الصورة</label><input id="i-img" value="https://images.unsplash.com/photo-1532375810709-75b1da00537c?w=1200&q=80" /></div>
    <div style="display:flex;gap:10px;margin-top:4px">
      <button class="btn" onclick="play()">▶ تشغيل</button>
      <button class="btn ghost" onclick="play()">⟲ إعادة</button>
    </div>
  </div>
</div>

<script>
  function fit(){const s=document.getElementById('stage');const r=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform=`scale(${r})`}
  addEventListener('resize',fit);fit();

  function splitLines(el, text){
    el.innerHTML = '';
    // break into ~3 lines using comma/space heuristics
    const words = text.split(/\s+/);
    const lines = [];
    const chunk = Math.ceil(words.length/3);
    for(let i=0;i<words.length;i+=chunk) lines.push(words.slice(i,i+chunk).join(' '));
    lines.forEach((ln,i)=>{
      const wrap=document.createElement('span');wrap.className='ln';
      const inner=document.createElement('span');inner.textContent=ln;
      inner.style.animationDelay=(1.0 + i*.15)+'s';
      wrap.appendChild(inner);el.appendChild(wrap);
    });
  }

  function render(){
    splitLines(document.getElementById('title'), document.getElementById('i-title').value);
    document.getElementById('deck').textContent = document.getElementById('i-deck').value;
    document.getElementById('tag').textContent = document.getElementById('i-tag').value;
    document.getElementById('caption').textContent = document.getElementById('i-caption').value;
    document.getElementById('author').textContent = document.getElementById('i-author').value;
    document.getElementById('source').textContent = document.getElementById('i-source').value;
    document.getElementById('photo').src = document.getElementById('i-img').value;
  }

  function play(){
    render();
    const s=document.getElementById('stage');
    s.classList.remove('playing'); void s.offsetWidth; s.classList.add('playing');
  }

  render();
  setTimeout(play,200);
</script>
  <script src="./template-bridge.js"></script>
</body>
</html>
