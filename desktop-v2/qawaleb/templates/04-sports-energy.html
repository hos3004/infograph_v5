<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>الصدارة · Sports Energy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=Cairo:wght@700;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0a0a0a;
    --paper:#f6f4ef;
    --hot:#f5d000;   /* energetic yellow */
    --hot-2:#ffb300;
    --blue:#0a2a6b;
    --red:#e10600;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;font-family:"IBM Plex Sans Arabic",system-ui;color:var(--ink)}
  .viewport{position:fixed;inset:0;display:grid;place-items:center;background:#000}
  .stage{
    width:1920px;height:1080px;
    transform-origin:center center;
    position:relative;overflow:hidden;background:var(--ink);
  }

  /* Diagonal halftone background */
  .bg{position:absolute;inset:0;
    background:
      radial-gradient(circle at 20% 30%, rgba(245,208,0,.18) 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(225,6,0,.16) 0%, transparent 50%),
      linear-gradient(160deg, #0a0a0a 0%, #161616 100%);
  }
  .dots{position:absolute;inset:0;opacity:.18;
    background-image:radial-gradient(circle, #f5d000 1.2px, transparent 1.5px);
    background-size:18px 18px;
    mask-image:linear-gradient(120deg, transparent 30%, black 70%);
  }

  /* Diagonal slabs */
  .slab{position:absolute;left:-10%;width:80%;height:170%;transform:rotate(18deg);transform-origin:top left;top:-30%;
    background:var(--hot);
    transform:translate(-120%, 0) rotate(18deg);
  }
  .slab.b{background:var(--ink);left:-2%;opacity:.96;transform:translate(-120%,0) rotate(18deg);}
  .slab.c{background:var(--hot-2);left:-18%;width:90%;opacity:.92;transform:translate(-130%,0) rotate(18deg);}

  /* Image — parallelogram on the right */
  .photo{
    position:absolute;left:920px;top:160px;width:920px;height:760px;
    transform:skewX(-12deg) translateY(40px);
    overflow:hidden;background:#222;
    opacity:0;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
    border:6px solid var(--hot);
  }
  .photo img{width:100%;height:100%;object-fit:cover;transform:skewX(12deg) scale(1.18);filter:contrast(1.1)}
  .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(45deg, rgba(245,208,0,.25), transparent 40%);mix-blend-mode:screen}

  /* Sticker badges */
  .sticker{position:absolute;background:var(--hot);color:var(--ink);font-family:"Cairo";font-weight:900;
    padding:14px 22px;letter-spacing:.04em;font-size:30px;
    box-shadow:0 8px 0 var(--ink);
  }
  .sticker.live{
    top:96px;right:88px;background:var(--red);color:#fff;display:flex;align-items:center;gap:14px;
    transform:rotate(-3deg) scale(.6);opacity:0;
  }
  .sticker.live::before{content:"";width:14px;height:14px;border-radius:999px;background:#fff;animation:pulse 1.2s infinite}
  .sticker.cat{
    top:170px;right:88px;background:var(--hot);color:var(--ink);font-size:22px;
    transform:rotate(2deg) scale(.6);opacity:0;
  }

  /* Headline column */
  .col{position:absolute;left:80px;top:200px;width:980px;z-index:5}
  .kicker{display:inline-block;padding:8px 18px;background:var(--ink);color:var(--hot);
    font-family:"Roboto Mono";font-weight:700;font-size:22px;letter-spacing:.18em;
    border:3px solid var(--hot);
    opacity:0;transform:translateX(40px);
  }
  .title{
    margin-top:30px;font-family:"Cairo",sans-serif;font-weight:900;
    font-size:148px;line-height:.92;color:#fff;letter-spacing:-.02em;
    text-transform:none;text-wrap:balance;
  }
  .title .word{display:inline-block;opacity:0;transform:translateX(60px) skewX(-12deg);transform-origin:right}
  .title .em{
    background:var(--hot);color:var(--ink);padding:0 18px;display:inline-block;
    transform:skewX(-12deg);
  }
  .title .em > span{display:inline-block;transform:skewX(12deg)}

  .stats{margin-top:42px;display:flex;gap:32px;opacity:0;transform:translateY(20px)}
  .stat{padding:18px 28px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);min-width:160px}
  .stat .v{font-family:"Cairo";font-weight:900;font-size:54px;color:var(--hot);line-height:1}
  .stat .k{font-family:"Reem Kufi";font-size:18px;color:#cfcfcf;margin-top:4px;letter-spacing:.06em}

  .body{margin-top:36px;font-family:"IBM Plex Sans Arabic";font-weight:400;color:#e6e6e6;
    font-size:28px;line-height:1.5;max-width:880px;opacity:0;transform:translateY(20px);text-wrap:pretty}

  /* Bottom score-strip */
  .strip{position:absolute;left:0;right:0;bottom:0;height:90px;display:flex;align-items:stretch;z-index:6;transform:translateY(110%)}
  .strip .a{background:var(--hot);color:var(--ink);font-family:"Cairo";font-weight:900;font-size:34px;display:flex;align-items:center;padding:0 40px;clip-path:polygon(0 0,100% 0,94% 100%,0 100%);min-width:300px}
  .strip .b{flex:1;background:var(--ink);color:var(--hot);font-family:"Roboto Mono";font-size:24px;display:flex;align-items:center;padding:0 40px;overflow:hidden;letter-spacing:.14em}
  .strip .b span{white-space:nowrap;animation:crawl 22s linear infinite;padding-left:80px}
  .strip .c{background:#fff;color:var(--ink);font-family:"Cairo";font-weight:900;font-size:28px;display:flex;align-items:center;padding:0 32px;border-right:6px solid var(--hot)}

  /* Stamp */
  .stamp{position:absolute;left:80px;bottom:120px;display:flex;align-items:center;gap:18px;z-index:5;opacity:0;transform:translateY(20px)}
  .stamp .num{font-family:"Cairo";font-weight:900;color:var(--hot);font-size:80px;line-height:1;text-shadow:6px 6px 0 var(--ink)}
  .stamp .lbl{font-family:"Reem Kufi";font-weight:500;color:#fff;letter-spacing:.2em;font-size:22px;text-transform:uppercase}

  /* Speed lines */
  .speed{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0}
  .speed div{position:absolute;height:2px;background:linear-gradient(90deg, transparent, var(--hot));transform-origin:left}
  .playing .speed{animation:flash .6s 1.0s ease forwards}

  /* Activation */
  .playing .slab{animation:slabIn .6s cubic-bezier(.6,.05,.2,1) forwards}
  .playing .slab.c{animation-delay:.1s}
  .playing .slab.b{animation-delay:.22s}
  .playing .slab{animation-name:slabIn}
  .playing .photo{animation:photoIn .7s .55s cubic-bezier(.2,.8,.2,1) forwards}
  .playing .sticker.live{animation:stick .5s .9s cubic-bezier(.34,1.56,.64,1) forwards}
  .playing .sticker.cat{animation:stick .5s 1.1s cubic-bezier(.34,1.56,.64,1) forwards}
  .playing .kicker{animation:slide .6s .8s cubic-bezier(.2,.8,.2,1) forwards}
  .playing .title .word{animation:wordSlam .65s cubic-bezier(.2,.8,.2,1) forwards}
  .playing .stats{animation:rise .8s 2.4s cubic-bezier(.2,.8,.2,1) forwards}
  .playing .body{animation:rise .8s 2.6s cubic-bezier(.2,.8,.2,1) forwards}
  .playing .strip{animation:stripIn .7s 1.8s cubic-bezier(.2,.8,.2,1) forwards}
  .playing .stamp{animation:rise .8s 3s cubic-bezier(.2,.8,.2,1) forwards}

  @keyframes slabIn{to{transform:translate(0,0) rotate(18deg)}}
  @keyframes photoIn{to{opacity:1;transform:skewX(-12deg) translateY(0)}}
  @keyframes stick{to{opacity:1;transform:rotate(-3deg) scale(1)}}
  .sticker.cat{}
  .playing .sticker.cat{animation:stickCat .5s 1.1s cubic-bezier(.34,1.56,.64,1) forwards}
  @keyframes stickCat{to{opacity:1;transform:rotate(2deg) scale(1)}}
  @keyframes slide{to{opacity:1;transform:translate(0,0)}}
  @keyframes wordSlam{to{opacity:1;transform:translateX(0) skewX(0)}}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  @keyframes stripIn{to{transform:translateY(0)}}
  @keyframes pulse{50%{opacity:.3}}
  @keyframes crawl{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
  @keyframes flash{0%{opacity:0}40%{opacity:1}100%{opacity:0}}

  /* Controls */
  .controls{position:fixed;left:24px;bottom:24px;z-index:50;
    background:rgba(20,20,20,.92);border:1px solid #2a2a2a;backdrop-filter:blur(10px);
    color:#eee;padding:14px;border-radius:14px;width:440px;
    font-family:"Reem Kufi";font-size:14px;box-shadow:0 30px 60px rgba(0,0,0,.6);transition:transform .3s ease;
  }
  .controls.collapsed{transform:translateY(calc(100% - 56px))}
  .controls h3{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:16px;margin-bottom:10px;cursor:pointer}
  .controls h3 .chev{color:#888;font-family:"Roboto Mono"}
  .controls label{display:block;color:#aaa;font-size:11px;margin-bottom:4px;letter-spacing:.04em;text-transform:uppercase;font-family:"Roboto Mono"}
  .controls input,.controls textarea{width:100%;background:#0d0d0d;border:1px solid #2a2a2a;color:#eee;padding:9px 11px;border-radius:8px;font-family:inherit;font-size:14px;resize:vertical}
  .controls textarea{min-height:64px}
  .controls .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .controls .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .controls .grid{display:grid;gap:10px}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--hot);color:var(--ink);border:0;padding:10px 18px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer}
  .btn:hover{background:#ffd936}
  .btn.ghost{background:#222;color:#eee}
</style>
</head>
<body>
<div class="viewport">
  <div class="stage" id="stage">
    <div class="bg"></div>
    <div class="dots"></div>

    <div class="slab c"></div>
    <div class="slab b"></div>
    <div class="slab"></div>

    <div class="photo"><img id="photo" src="" alt="" /></div>

    <div class="sticker live">LIVE</div>
    <div class="sticker cat" id="cat">رياضة · بريميرليغ</div>

    <div class="speed">
      <div style="top:18%;left:-2%;width:38%;transform:rotate(-12deg)"></div>
      <div style="top:42%;left:6%;width:48%;transform:rotate(-12deg)"></div>
      <div style="top:71%;left:-8%;width:42%;transform:rotate(-12deg)"></div>
    </div>

    <div class="col">
      <span class="kicker" id="kicker">انتصار تاريخي</span>
      <h1 class="title" id="title"></h1>
      <div class="stats">
        <div class="stat"><div class="v" id="s1v">٤–١</div><div class="k" id="s1k">النتيجة النهائية</div></div>
        <div class="stat"><div class="v" id="s2v">٧٢٪</div><div class="k" id="s2k">الاستحواذ</div></div>
        <div class="stat"><div class="v" id="s3v">٢٤</div><div class="k" id="s3k">تسديدات</div></div>
      </div>
      <p class="body" id="body"></p>
    </div>

    <div class="stamp"><span class="num" id="stamp">٠١</span><span class="lbl" id="src-label">SOURCE · SPORTS DESK</span></div>

    <div class="strip">
      <div class="a">آخر الأخبار</div>
      <div class="b"><span id="crawl"></span></div>
      <div class="c" id="clock">٢٢:٤٧</div>
    </div>
  </div>
</div>

<div class="controls" id="controls">
  <h3 onclick="document.getElementById('controls').classList.toggle('collapsed')"><span>لوحة التحكم — Sports</span><span class="chev">▾</span></h3>
  <div class="grid">
    <div><label>العنوان (استخدم {} للتمييز)</label><textarea id="i-title">الفريق الأخضر يحقق {الصدارة} بعد فوز ساحق</textarea></div>
    <div><label>نص الخبر</label><textarea id="i-body">سيطر الفريق على مجريات اللقاء منذ الدقائق الأولى، وسجّل أربعة أهداف متتالية لينفرد بصدارة الترتيب العام قبل خمس جولات من نهاية الموسم.</textarea></div>
    <div class="row">
      <div><label>الكيكر</label><input id="i-kicker" value="انتصار تاريخي" /></div>
      <div><label>التصنيف</label><input id="i-cat" value="رياضة · بريميرليغ" /></div>
    </div>
    <div class="row3">
      <div><label>إحصاء ١</label><input id="i-s1v" value="٤–١" /></div>
      <div><label>إحصاء ٢</label><input id="i-s2v" value="٧٢٪" /></div>
      <div><label>إحصاء ٣</label><input id="i-s3v" value="٢٤" /></div>
    </div>
    <div class="row3">
      <div><label>عنوان ١</label><input id="i-s1k" value="النتيجة النهائية" /></div>
      <div><label>عنوان ٢</label><input id="i-s2k" value="الاستحواذ" /></div>
      <div><label>عنوان ٣</label><input id="i-s3k" value="تسديدات" /></div>
    </div>
    <div class="row">
      <div><label>المصدر</label><input id="i-source" value="SOURCE · SPORTS DESK" /></div>
      <div><label>الوقت</label><input id="i-clock" value="٢٢:٤٧" /></div>
    </div>
    <div><label>رابط الصورة</label><input id="i-img" value="https://images.unsplash.com/photo-1517466787929-bc90951d0974?w=2000&q=80" /></div>
    <div style="display:flex;gap:10px;margin-top:4px">
      <button class="btn" onclick="play()">▶ تشغيل</button>
      <button class="btn ghost" onclick="play()">⟲ إعادة</button>
    </div>
  </div>
</div>

<script>
  function fit(){const s=document.getElementById('stage');const r=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform=`scale(${r})`}
  addEventListener('resize',fit);fit();

  function buildTitle(el, raw){
    el.innerHTML='';
    // Split words but preserve {emphasized} chunks
    const tokens = raw.split(/(\{[^}]+\})/g).filter(Boolean);
    let idx=0;
    tokens.forEach(tok=>{
      if(/^\{.+\}$/.test(tok)){
        const word=document.createElement('span');word.className='word em';
        const inner=document.createElement('span');inner.textContent=tok.slice(1,-1);
        word.appendChild(inner);
        word.style.animationDelay=(1.0 + idx*.08)+'s';
        el.appendChild(word); el.appendChild(document.createTextNode(' ')); idx++;
      } else {
        tok.split(/\s+/).filter(Boolean).forEach(w=>{
          const sp=document.createElement('span');sp.className='word';sp.textContent=w;
          sp.style.animationDelay=(1.0 + idx*.08)+'s';
          el.appendChild(sp); el.appendChild(document.createTextNode(' ')); idx++;
        });
      }
    });
  }

  function render(){
    const t=document.getElementById('i-title').value;
    buildTitle(document.getElementById('title'),t);
    document.getElementById('body').textContent=document.getElementById('i-body').value;
    document.getElementById('kicker').textContent=document.getElementById('i-kicker').value;
    document.getElementById('cat').textContent=document.getElementById('i-cat').value;
    document.getElementById('s1v').textContent=document.getElementById('i-s1v').value;
    document.getElementById('s2v').textContent=document.getElementById('i-s2v').value;
    document.getElementById('s3v').textContent=document.getElementById('i-s3v').value;
    document.getElementById('s1k').textContent=document.getElementById('i-s1k').value;
    document.getElementById('s2k').textContent=document.getElementById('i-s2k').value;
    document.getElementById('s3k').textContent=document.getElementById('i-s3k').value;
    document.getElementById('src-label').textContent=document.getElementById('i-source').value;
    document.getElementById('clock').textContent=document.getElementById('i-clock').value;
    document.getElementById('photo').src=document.getElementById('i-img').value;
    document.getElementById('crawl').textContent=document.getElementById('i-title').value.replace(/[{}]/g,'') + '   •   ' + document.getElementById('i-body').value;
  }
  function play(){render();const s=document.getElementById('stage');s.classList.remove('playing');void s.offsetWidth;s.classList.add('playing')}
  render();setTimeout(play,200);
</script>
  <script src="./template-bridge.js"></script>
</body>
</html>
