<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>وثائقي · Cinematic Dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;700&family=Roboto+Mono:wght@300;400&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#f5f3ee;
    --muted:#a8a39a;
    --accent:#d9a14a;
    --line:rgba(245,243,238,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;color:var(--ink);overflow:hidden;font-family:"IBM Plex Sans Arabic",system-ui}
  .viewport{position:fixed;inset:0;display:grid;place-items:center;background:#000}
  .stage{
    width:1920px;height:1080px;
    transform-origin:center center;
    position:relative;overflow:hidden;background:#0d0d0d;
  }

  /* Full bleed image */
  .bg{position:absolute;inset:0;overflow:hidden;background:#000}
  .bg img{width:100%;height:100%;object-fit:cover;transform:scale(1.18) translate(0,0);
    animation:burns 22s ease-out infinite alternate;
    filter:contrast(1.06) saturate(.85) brightness(.85);
  }
  .bg::after{
    content:"";position:absolute;inset:0;
    background:
      linear-gradient(180deg, rgba(0,0,0,.55) 0%, transparent 30%, transparent 50%, rgba(0,0,0,.95) 100%),
      linear-gradient(90deg, rgba(0,0,0,.6) 0%, transparent 40%, transparent 60%, rgba(0,0,0,.4) 100%);
  }
  @keyframes burns{from{transform:scale(1.12) translate(2%,1%)}to{transform:scale(1.22) translate(-2%,-1%)}}

  /* Letterbox bars */
  .bar-top, .bar-bot{position:absolute;left:0;right:0;background:#000;z-index:5}
  .bar-top{top:0;height:90px;transform:translateY(-100%)}
  .bar-bot{bottom:0;height:120px;transform:translateY(100%)}

  /* Top meta */
  .topmeta{position:absolute;top:0;left:0;right:0;height:90px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 56px;z-index:6;
    color:#cfc8b8;font-family:"Roboto Mono";letter-spacing:.18em;text-transform:uppercase;font-size:16px;opacity:0;
  }
  .topmeta .l{display:flex;align-items:center;gap:14px}
  .topmeta .l .ring{width:12px;height:12px;border:1px solid var(--accent);border-radius:999px;position:relative}
  .topmeta .l .ring::after{content:"";position:absolute;inset:3px;background:var(--accent);border-radius:999px}
  .topmeta .c{font-family:"Reem Kufi";font-weight:500;letter-spacing:.4em;color:var(--accent);font-size:18px}

  /* Center scrim card pinned to bottom-left */
  .content{position:absolute;left:96px;right:96px;bottom:160px;z-index:6;max-width:1320px}
  .chapter{display:flex;align-items:center;gap:20px;margin-bottom:30px;opacity:0;transform:translateY(20px)}
  .chapter .num{font-family:"Roboto Mono";font-size:18px;color:var(--accent);letter-spacing:.3em}
  .chapter .line{width:120px;height:1px;background:var(--accent)}
  .chapter .tag{font-family:"Reem Kufi";font-weight:500;color:var(--ink);font-size:22px;letter-spacing:.3em;text-transform:uppercase}

  .title{
    font-family:"Reem Kufi";font-weight:700;color:#fff;
    font-size:132px;line-height:1.02;letter-spacing:-.005em;
    text-shadow:0 4px 60px rgba(0,0,0,.6);
    text-wrap:balance;
  }
  .title .clip{display:block;overflow:hidden;padding-bottom:.04em}
  .title .clip span{display:block;transform:translateY(110%);opacity:0;filter:blur(8px)}

  .deck{margin-top:36px;font-family:"IBM Plex Sans Arabic";font-weight:300;color:#e8e4d8;
    font-size:34px;line-height:1.45;max-width:1100px;text-wrap:pretty;
    opacity:0;transform:translateY(12px);
  }

  .src-row{position:absolute;left:96px;right:96px;bottom:50px;z-index:7;display:flex;align-items:center;justify-content:space-between;
    color:var(--muted);font-family:"Roboto Mono";letter-spacing:.2em;text-transform:uppercase;font-size:16px;opacity:0;
  }
  .src-row .src{display:flex;align-items:center;gap:14px}
  .src-row .src .pip{width:8px;height:8px;background:var(--accent);transform:rotate(45deg)}
  .src-row .ts{display:flex;align-items:center;gap:18px}
  .src-row .ts .rec{width:10px;height:10px;border-radius:999px;background:#e10600;box-shadow:0 0 10px #e10600;animation:rec 1.4s infinite}
  @keyframes rec{50%{opacity:.3}}

  /* Corner reticles */
  .ret{position:absolute;width:36px;height:36px;border:1px solid var(--ink);opacity:0;z-index:6}
  .ret.tl{top:108px;left:56px;border-right:0;border-bottom:0}
  .ret.tr{top:108px;right:56px;border-left:0;border-bottom:0}
  .ret.bl{bottom:140px;left:56px;border-right:0;border-top:0}
  .ret.br{bottom:140px;right:56px;border-left:0;border-top:0}

  /* Vignette overlay & noise */
  .vignette{position:absolute;inset:0;pointer-events:none;z-index:4;
    box-shadow:inset 0 0 380px 60px rgba(0,0,0,.95);
  }
  .grain{position:absolute;inset:0;pointer-events:none;z-index:5;mix-blend-mode:overlay;opacity:.14;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation:grain 1.2s steps(4) infinite;
  }
  @keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-2%,1%)}50%{transform:translate(1%,-2%)}75%{transform:translate(-1%,-1%)}100%{transform:translate(2%,1%)}}

  /* Activation */
  .playing .bar-top{animation:slideY .7s .05s cubic-bezier(.7,.05,.2,1) forwards}
  .playing .bar-bot{animation:slideY .7s .05s cubic-bezier(.7,.05,.2,1) forwards}
  .playing .topmeta{animation:fade .8s .8s ease forwards}
  .playing .ret{animation:fadeIn 1s 1.1s ease forwards}
  .playing .chapter{animation:rise .8s 1.2s cubic-bezier(.2,.8,.2,1) forwards}
  .playing .title .clip span{animation:clipUp 1.1s cubic-bezier(.2,.8,.2,1) forwards}
  .playing .deck{animation:rise 1.1s 3s cubic-bezier(.2,.8,.2,1) forwards}
  .playing .src-row{animation:fade .8s 3.6s ease forwards}

  @keyframes slideY{to{transform:translateY(0)}}
  @keyframes fade{to{opacity:1}}
  @keyframes fadeIn{to{opacity:.7}}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  @keyframes clipUp{to{transform:translateY(0);opacity:1;filter:blur(0)}}

  /* Controls */
  .controls{position:fixed;left:24px;bottom:24px;z-index:50;
    background:rgba(20,20,20,.92);border:1px solid #2a2a2a;backdrop-filter:blur(10px);
    color:#eee;padding:14px;border-radius:14px;width:420px;
    font-family:"Reem Kufi";font-size:14px;box-shadow:0 30px 60px rgba(0,0,0,.6);transition:transform .3s ease;
  }
  .controls.collapsed{transform:translateY(calc(100% - 56px))}
  .controls h3{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:16px;margin-bottom:10px;cursor:pointer}
  .controls h3 .chev{color:#888;font-family:"Roboto Mono"}
  .controls label{display:block;color:#aaa;font-size:11px;margin-bottom:4px;letter-spacing:.04em;text-transform:uppercase;font-family:"Roboto Mono"}
  .controls input,.controls textarea{width:100%;background:#0d0d0d;border:1px solid #2a2a2a;color:#eee;padding:9px 11px;border-radius:8px;font-family:inherit;font-size:14px;resize:vertical}
  .controls textarea{min-height:64px}
  .controls .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .controls .grid{display:grid;gap:10px}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#1a1407;border:0;padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer}
  .btn:hover{background:#e7b766}
  .btn.ghost{background:#222;color:#eee}
</style>
</head>
<body>
<div class="viewport">
  <div class="stage" id="stage">
    <div class="bg"><img id="photo" src="" alt="" /></div>
    <div class="vignette"></div>
    <div class="grain"></div>

    <div class="bar-top"></div>
    <div class="bar-bot"></div>

    <div class="topmeta">
      <div class="l"><span class="ring"></span><span id="loc">LIVE · BEIRUT</span></div>
      <div class="c" id="brand">DISPATCH · المراسلون</div>
      <div class="r" style="text-align:left" id="dur">RUNTIME · 04:18</div>
    </div>

    <span class="ret tl"></span><span class="ret tr"></span><span class="ret bl"></span><span class="ret br"></span>

    <div class="content">
      <div class="chapter">
        <span class="num" id="num">CHAPTER 01</span>
        <span class="line"></span>
        <span class="tag" id="tag">تحقيق ميداني</span>
      </div>
      <h1 class="title" id="title"></h1>
      <p class="deck" id="deck"></p>
    </div>

    <div class="src-row">
      <div class="src"><span class="pip"></span><span id="source">SOURCE · المراسل الميداني — صور حصرية</span></div>
      <div class="ts"><span class="rec"></span><span id="ts">REC · 22:47:13</span></div>
    </div>
  </div>
</div>

<div class="controls" id="controls">
  <h3 onclick="document.getElementById('controls').classList.toggle('collapsed')"><span>لوحة التحكم — Cinematic</span><span class="chev">▾</span></h3>
  <div class="grid">
    <div><label>العنوان</label><textarea id="i-title">في قلب المدينة المحاصرة: شهادات لم تُروَ من قبل</textarea></div>
    <div><label>الوصف</label><textarea id="i-deck">على مدى ثلاثة أسابيع، تنقّل فريقنا بين الأحياء المتضررة ليجمع شهادات أهلٍ صمدوا تحت القصف، وأطباءٍ عملوا في عيادات مرتجلة، وأطفالٍ ابتكروا ألعاباً من بقايا الحياة اليومية.</textarea></div>
    <div class="row">
      <div><label>الفصل</label><input id="i-num" value="CHAPTER 01" /></div>
      <div><label>التصنيف</label><input id="i-tag" value="تحقيق ميداني" /></div>
    </div>
    <div class="row">
      <div><label>الموقع</label><input id="i-loc" value="LIVE · BEIRUT" /></div>
      <div><label>المدة</label><input id="i-dur" value="RUNTIME · 04:18" /></div>
    </div>
    <div><label>المصدر</label><input id="i-source" value="SOURCE · المراسل الميداني — صور حصرية" /></div>
    <div><label>رابط الصورة</label><input id="i-img" value="https://images.unsplash.com/photo-1518709268805-4e9042af2176?w=2000&q=80" /></div>
    <div style="display:flex;gap:10px;margin-top:4px">
      <button class="btn" onclick="play()">▶ تشغيل</button>
      <button class="btn ghost" onclick="play()">⟲ إعادة</button>
    </div>
  </div>
</div>

<script>
  function fit(){const s=document.getElementById('stage');const r=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform=`scale(${r})`}
  addEventListener('resize',fit);fit();

  function splitClips(el, text){
    el.innerHTML='';
    const words=text.split(/\s+/);
    const lines=[];
    const chunk=Math.ceil(words.length/2.2);
    for(let i=0;i<words.length;i+=chunk) lines.push(words.slice(i,i+chunk).join(' '));
    lines.forEach((ln,i)=>{
      const wrap=document.createElement('span');wrap.className='clip';
      const inner=document.createElement('span');inner.textContent=ln;
      inner.style.animationDelay=(1.5 + i*.25)+'s';
      wrap.appendChild(inner);el.appendChild(wrap);
    });
  }

  function render(){
    splitClips(document.getElementById('title'), document.getElementById('i-title').value);
    document.getElementById('deck').textContent=document.getElementById('i-deck').value;
    document.getElementById('num').textContent=document.getElementById('i-num').value;
    document.getElementById('tag').textContent=document.getElementById('i-tag').value;
    document.getElementById('loc').textContent=document.getElementById('i-loc').value;
    document.getElementById('dur').textContent=document.getElementById('i-dur').value;
    document.getElementById('source').textContent=document.getElementById('i-source').value;
    document.getElementById('photo').src=document.getElementById('i-img').value;
  }
  function play(){render();const s=document.getElementById('stage');s.classList.remove('playing');void s.offsetWidth;s.classList.add('playing')}
  render();setTimeout(play,200);
</script>
  <script src="./template-bridge.js"></script>
</body>
</html>
